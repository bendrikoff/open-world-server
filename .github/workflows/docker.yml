name: Deploy Server

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Clean workspace (fix Docker root-owned files)
        run: sudo rm -rf ${{ github.workspace }}/certbot ${{ github.workspace }}/logs || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stop previous containers
        run: docker compose down --remove-orphans || true

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          MONITOR_USER=${{ secrets.MONITOR_USER }}
          MONITOR_PASSWORD=${{ secrets.MONITOR_PASSWORD }}
          EOF

      - name: Build and start containers
        run: docker compose up --build -d

      - name: Show running containers
        run: docker ps

      - name: Show recent logs
        run: docker compose logs --tail 30
