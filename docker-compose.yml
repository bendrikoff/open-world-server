services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "2567"
    environment:
      NODE_ENV: production
      PORT: 2567
      COLYSEUS_SEAT_RESERVATION_TIME: ${COLYSEUS_SEAT_RESERVATION_TIME:-60}
      MONITOR_USER: ${MONITOR_USER}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    environment:
      CERT_RELOAD_INTERVAL_SECONDS: ${CERT_RELOAD_INTERVAL_SECONDS:-300}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint-custom.sh:ro
      - /home/bendrikoff/certbot/conf:/etc/letsencrypt
      - /home/bendrikoff/certbot/www:/var/www/certbot:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint-custom.sh"]
    depends_on:
      - server
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - /home/bendrikoff/certbot/conf:/etc/letsencrypt
      - /home/bendrikoff/certbot/www:/var/www/certbot
    depends_on:
      - nginx
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --preferred-challenges http; sleep 12h & wait $${!}; done;'"
